[project]
name = "bornona-ibus"
version = "0.1.0"
description = "A fixed-layout Bangla (Bornona) input method for Linux, built on IBus."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
