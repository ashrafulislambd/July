[project]
name = "bornona-ibus"
version = "0.1.1"
description = "A fixed-layout Bangla (Bornona) input method for Linux, built on IBus."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
bornona-ibus-engine = "bornona_ibus.main:main"
bornona-ibus-bar = "bornona_ibus.floating_bar.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
